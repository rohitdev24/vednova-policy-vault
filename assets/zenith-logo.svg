<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 120" width="420" height="120">
  <defs>
    <linearGradient id="zenithGoldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff6db"/>
      <stop offset="50%" stop-color="#e2bf75"/>
      <stop offset="100%" stop-color="#a87a2a"/>
    </linearGradient>
    <linearGradient id="zenithShieldGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0e1e36"/>
      <stop offset="100%" stop-color="#070f1e"/>
    </linearGradient>
  </defs>

  <!-- Crest Emblem: Geometric Diamond Peak -->
  <g transform="translate(10, 10)">
    <!-- Shield / Diamond Outline -->
    <polygon points="50,4 94,30 84,82 50,98 16,82 6,30" fill="url(#zenithShieldGrad)" stroke="url(#zenithGoldGrad)" stroke-width="2.5"/>
    <polygon points="50,11 87,34 78,76 50,90 22,76 13,34" fill="none" stroke="rgba(226, 191, 117, 0.35)" stroke-width="1"/>
    
    <!-- Zenith Apex Mountain Peak Lines -->
    <path d="M 30,68 L 50,34 L 70,68 Z" fill="none" stroke="url(#zenithGoldGrad)" stroke-width="1.8"/>
    <path d="M 42,68 L 50,52 L 58,68 Z" fill="rgba(226, 191, 117, 0.4)" stroke="url(#zenithGoldGrad)" stroke-width="1"/>
    <circle cx="50" cy="26" r="3" fill="url(#zenithGoldGrad)"/>

    <!-- Est Year -->
    <text x="50" y="84" font-family="'Plus Jakarta Sans', sans-serif" font-size="8" font-weight="700" fill="#94a3b8" text-anchor="middle" letter-spacing="2.5">ESTD 2004</text>
  </g>

  <!-- Firm Name Typography -->
  <g transform="translate(125, 24)">
    <text x="0" y="28" font-family="'Cinzel', 'Georgia', serif" font-size="20" font-weight="700" fill="#ffffff" letter-spacing="1.5">ZENITH WEALTH</text>
    <text x="0" y="48" font-family="'Plus Jakarta Sans', sans-serif" font-size="9.5" font-weight="600" fill="#e2bf75" letter-spacing="3.5">ADVISORS PVT. LTD.</text>
    <text x="0" y="67" font-family="'Plus Jakarta Sans', sans-serif" font-size="8.5" font-weight="500" fill="#94a3b8" letter-spacing="1">MUTUAL FUND DISTRIBUTOR · ARN-48291</text>
  </g>
</svg>
